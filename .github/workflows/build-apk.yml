name: Build APK

on:
  push:
    # Semua branch (termasuk main) dan semua tag rilis.
    branches: ["**"]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Ambil kode (+ submodule llama.cpp)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Pasang JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK (bawaan runner)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Memakai $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;35.0.0" "platform-tools" "ndk;28.2.13676358" "cmake;3.31.6" > /dev/null

      - name: Pasang Gradle (dengan cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Kunci tanda tangan APK tetap (agar update bisa menimpa versi lama)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gemma-agent-debug-keystore-v1

      - name: Build APK rilis (Gradle + NDK/CMake llama.cpp arm64-v8a) + unit test
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease testDebugUnitTest --stacktrace --no-daemon

      - name: Siapkan file APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/GemmaChatHybrid.apk
          ls -lh out

      - name: Unggah APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: GemmaChatHybrid-APK
          path: out/GemmaChatHybrid.apk
          if-no-files-found: error

      - name: Terbitkan ke halaman Releases (tag apk-terbaru)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-terbaru --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create apk-terbaru out/GemmaChatHybrid.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "GemmaChat Hybrid APK (build terbaru)" \
            --notes "APK otomatis dari commit $GITHUB_SHA (${GITHUB_REF_NAME}). Unduh GemmaChatHybrid.apk di bawah lalu instal di HP."
